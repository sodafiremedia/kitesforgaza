name: pages-gh-pages-deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site with Jekyll
        run: |
          gem install bundler
          bundle install
          bundle exec jekyll build -d ./_site

      - name: Ensure CNAME in site output
        run: |
          BUILD_DIR="./_site"
          mkdir -p "$BUILD_DIR"
          echo "abqkitesforgaza.art" > "$BUILD_DIR/CNAME"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # Optional: keep existing files if you want incremental updates
          keep_files: false